spring:
  application:
    name: 42-clubs-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clubs}
    username: ${DB_USERNAME:clubs}
    password: ${DB_PASSWORD:clubs_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 27MB
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: ${AUTH_COOKIE_SAME_SITE:lax}

app:
  photos:
    mode: ${PHOTO_STORAGE_MODE:local}
    local-directory: ${PHOTO_LOCAL_DIRECTORY:./data/photos}
    local-base-url: ${PHOTO_LOCAL_BASE_URL:http://localhost:8080}
    bucket: ${PHOTO_S3_BUCKET:}
    region: ${PHOTO_S3_REGION:ap-northeast-2}
    public-base-url: ${PHOTO_PUBLIC_BASE_URL:}
  auth:
    enabled: ${AUTH_ENABLED:false}
    client-id: ${FT_CLIENT_ID:}
    client-secret: ${FT_CLIENT_SECRET:}
    redirect-uri: ${FT_REDIRECT_URI:http://localhost:8080/login/oauth2/code/42}
    success-url: ${AUTH_SUCCESS_URL:http://localhost:5173/auth/callback}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
