spring:
  application:
    name: 42-clubs-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clubs}
    username: ${DB_USERNAME:clubs}
    password: ${DB_PASSWORD:clubs_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
